site_name: ASPM-AI
site_url: https://odineye-fiap.github.io/aspm-docs/
site_description: Plataforma ASPM com IA — pipeline GitHub → Kafka → scanners stateless
site_author: OdinEye-FIAP
repo_url: https://github.com/OdinEye-FIAP/aspm-docs
repo_name: OdinEye-FIAP/aspm-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Modo automático
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo escuro
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: pt
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Início: index.md
  - Visão geral:
      - O que é o ASPM-AI: overview/what-is-aspm.md
      - Arquitetura: overview/architecture.md
      - Decisões: overview/decisions.md
      - Repositórios: overview/repos.md
  - Design:
      - ishmael — Asset Inventory: design/ishmael.md
      - Revisão do schema (Pequod): design/schema-review.md
  - Projetos:
      - Pequod: pequod.md
      - Moby-dick: moby-dick.md
      - TARS AI: tars-ai.md
      - Heimdall Dashboard: heimdall-dashboard.md
      - Captain-hook: captain-hook.md
  - Desenvolvedor:
      - Começando: developer/getting-started.md
      - Adicionar novo scanner: developer/adding-a-scanner.md
      - GitHub App: developer/github-app-setup.md
      - Troubleshooting: developer/troubleshooting.md
  - Integração:
      - Onboarding de um repo: integration/onboarding-repo.md
      - Entendendo o check_run: integration/check-run.md
  - Referência:
      - JobDescriptor v1: reference/job-descriptor.md
      - Finding v1: reference/finding-v1.md
      - Schema do banco: reference/database-schema.md
      - Tópicos Kafka: reference/kafka-topics.md
      - Endpoints HTTP: reference/http-endpoints.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OdinEye-FIAP
